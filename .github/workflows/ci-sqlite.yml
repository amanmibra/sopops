name: ci-sqlite

# The backend suite on SQLite, the self-host default. Separate from ci so a SQLite-only failure is
# reported without holding back the hosted deployments, which run on Postgres.
on:
  push:
  pull_request:

concurrency:
  group: ci-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (sqlite)
    runs-on: ubuntu-latest
    env:
      SOP_BIN: /usr/local/bin/sop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install sop
        run: curl -fsSL https://raw.githubusercontent.com/sopops-dev/sop/main/install.sh | SOP_REF=v0.1.2 SOP_INSTALL_DIR=/usr/local/bin sudo -E sh
      - run: uv sync --all-extras --python 3.12
      # Spread across the runner's cores; each worker gets its own database (tests/conftest.py).
      - run: uv run pytest -q -n auto
