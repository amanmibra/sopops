name: release-sdk-python

# Publishes sdks/python to PyPI as `sopops`. Tag a release (`py-v0.1.0`) or run it by hand.
# No token: PyPI trusted publishing signs the upload with this workflow's OIDC identity. Configure the publisher
# once at https://pypi.org/manage/account/publishing (repo amanmibra/sopops, workflow release-sdk-python.yml,
# environment pypi). Bump `version` in sdks/python/pyproject.toml before tagging; PyPI refuses a repeat version.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI trusts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: sdks/python
        run: uv run --all-extras pytest -q
      - name: Build
        working-directory: sdks/python
        run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
