name: deploy

# Deploys the hosted sopops (app.sopops.dev) on Render after ci passes on a push to main.
# Render builds the private sopops-cloud Dockerfile, which fetches this repo at SOPOPS_REF (a build arg).
# Secrets: RENDER_API_KEY, and RENDER_SERVICE_IDS (the app's and the worker's service ids, space-separated).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # By hand, without waiting for ci: Actions > deploy > Run workflow, or `gh workflow run deploy`.
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (empty: the latest on main). Skips ci."
        required: false

permissions: {}

# One deploy at a time; a newer green main replaces one still waiting.
concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  render:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICES: ${{ secrets.RENDER_SERVICE_IDS }}
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      API: https://api.render.com/v1
    steps:
      - name: Skip until Render is set up
        if: env.RENDER_API_KEY == '' || env.SERVICES == ''
        run: echo "::notice::RENDER_API_KEY or RENDER_SERVICE_IDS isn't set, so nothing was deployed."
      # Pin each service's build to this commit, then deploy it. A new SOPOPS_REF busts the build cache from the
      # git fetch on.
      - name: Deploy at this commit
        if: env.RENDER_API_KEY != '' && env.SERVICES != ''
        run: |
          : > deploys.txt
          for svc in $SERVICES; do
            curl -fsS -X PUT "$API/services/$svc/env-vars/SOPOPS_REF" -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" -d "{\"value\": \"$SHA\"}" > /dev/null
            id=$(curl -fsS -X POST "$API/services/$svc/deploys" -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" -d '{"clearCache": "do_not_clear"}' | jq -r .id)
            echo "$svc $id" | tee -a deploys.txt
          done
      - name: Wait for the deploys
        if: env.RENDER_API_KEY != '' && env.SERVICES != ''
        timeout-minutes: 25
        run: |
          while read -r svc id; do
            while true; do
              status=$(curl -fsS "$API/services/$svc/deploys/$id" -H "Authorization: Bearer $RENDER_API_KEY" | jq -r .status)
              echo "$svc: $status"
              case "$status" in
                live) break ;;
                build_failed|update_failed|canceled|deactivated|pre_deploy_failed) exit 1 ;;
              esac
              sleep 15
            done
          done < deploys.txt
      - name: Health check
        if: env.RENDER_API_KEY != '' && env.SERVICES != ''
        run: curl -fsS --retry 5 --retry-all-errors https://app.sopops.dev/healthz
