name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Postgres is what the hosted deployments run on, so this job gates them (deploy.yml and
    # deploy-hosted.yml run after ci). SQLite, the self-host default, runs in ci-sqlite.yml without
    # blocking a deploy.
    name: backend (postgres)
    runs-on: ubuntu-latest
    env:
      SOPC_BIN: /usr/local/bin/sopc
      SOPOPS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Started by hand, not as a service, to raise max_connections: each parallel worker opens its own pools.
      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine -c max_connections=500
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          sleep 3  # the image restarts once after its first start
      - name: Install sopc
        run: curl -fsSL https://raw.githubusercontent.com/amanmibra/sopc/main/install.sh | SOPC_REF=v0.0.17 SOPC_INSTALL_DIR=/usr/local/bin sudo -E sh
      - run: uv sync --all-extras --python 3.12
      # Spread across the runner's cores; each worker gets its own database (tests/conftest.py).
      - run: uv run pytest -q -n auto

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the backend
        run: pnpm gen:api && git diff --exit-code -- openapi.json src/client
      - run: pnpm typecheck
      - run: pnpm build

  sdk-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 pytest -q
      - name: Types (strict, against livekit-agents and mcp)
        run: uv run --python 3.12 --extra livekit --extra mcp --with mypy mypy --strict src

  sdk-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # the dev toolchain (vite) needs 20+; the package itself runs on 18+
          cache: pnpm
          cache-dependency-path: sdks/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
