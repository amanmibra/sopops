name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Postgres is what the hosted deployment runs on, so this job gates it (deploy-hosted.yml runs
    # after ci). SQLite, the self-host default, runs in ci-sqlite.yml without blocking a deploy.
    name: backend (postgres)
    runs-on: ubuntu-latest
    env:
      SOP_BIN: /usr/local/bin/sop
      SOPOPS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Started by hand, not as a service, to raise max_connections: each parallel worker opens its own pools.
      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine -c max_connections=500
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          sleep 3  # the image restarts once after its first start
      - name: Install sop
        run: curl -fsSL https://raw.githubusercontent.com/sopops-dev/sop/main/install.sh | SOP_REF=v0.1.1 SOP_INSTALL_DIR=/usr/local/bin sudo -E sh
      - run: uv sync --all-extras --python 3.12
      # Spread across the runner's cores; each worker gets its own database (tests/conftest.py).
      - run: uv run pytest -q -n auto

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the backend
        run: pnpm gen:api && git diff --exit-code -- openapi.json src/client
      - run: pnpm typecheck
      - run: pnpm build

  sdk-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 pytest -q
      - name: Types (strict, against livekit-agents and mcp)
        run: uv run --python 3.12 --extra livekit --extra mcp --with mypy mypy --strict src

  sdk-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # the dev toolchain (vite) needs 20+; the package itself runs on 18+
          cache: pnpm
          cache-dependency-path: sdks/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The SDKs ship together under one version (release-sdk.yml), so a change that moves one alone fails here.
  sdk-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and Node SDK versions match
        run: |
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' sdks/python/pyproject.toml | head -n1)
          node=$(node -p 'require("./sdks/node/package.json").version')
          if [ "$py" != "$node" ]; then
            echo "::error::sdks/python is at $py and sdks/node at $node; release them together with release-sdk.yml"
            exit 1
          fi
          echo "Both SDKs at $py"
