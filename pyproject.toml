[project]
name = "sopops"
version = "0.1.0"
description = "Versioned sopc workspaces, and each agent's compiled prompt at call start."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.48",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "pyjwt[crypto]>=2.10",  # signs the GitHub App's JWT (RS256)
    "mcp>=2.3,<3",
    # Model calls as typed DSPy signatures (src/sopops/ai); pinned, upgrade deliberately. DSPy uses LiteLLM as its
    # fallback client: pinned below with hashes in uv.lock (1.82.7 and 1.82.8 on PyPI were compromised, March 2026).
    "dspy==3.4.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
hatchet = [
    "hatchet-sdk==1.42.1",
]
# TypeSafe's Jev (system-1 classifier) as the first pass of routing, checks and pattern assignment.
jev = [
    "typesafe-sdk==0.7.5",
]

[project.scripts]
sopops = "sopops.cli:main"
sopops-mcp = "sopops.mcp_server:main"

[tool.uv]
constraint-dependencies = ["litellm==1.105.1"]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "respx>=0.23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopops"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles web/dist, if built, as sopops/static

[tool.pytest.ini_options]
testpaths = ["tests"]
