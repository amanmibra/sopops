[project]
name = "sopops-server"
version = "0.1.0"
description = "Versioned sopc workspaces, and each agent's compiled prompt at call start."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.48",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "pyjwt[crypto]>=2.10",  # signs the GitHub App's JWT (RS256)
    "websockets>=14",  # ElevenLabs' monitor socket (Enterprise live monitoring)
    # Model calls as typed DSPy signatures (src/sopops_server/ai); pinned, upgrade deliberately. DSPy uses LiteLLM as its
    # fallback client: pinned below with hashes in uv.lock (1.82.7 and 1.82.8 on PyPI were compromised, March 2026).
    "dspy==3.4.1",
    "authlib>=1.6",  # sign-in with GitHub and Google (OAuth 2.0 with PKCE, OpenID Connect)
    "argon2-cffi>=23.1",  # password hashes (argon2id)
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
hatchet = [
    "hatchet-sdk==1.42.1",
]
# LiveKit with no code in the agent: join a room as a hidden participant and read its transcript (sopops_server.capture).
livekit = [
    "livekit>=1.0",
    "livekit-api>=1.0",
]
# TypeSafe's Jev (system-1 classifier) as the first pass of routing, checks and pattern assignment.
jev = [
    "typesafe-sdk==0.7.5",
]

[project.scripts]
sopops = "sopops_server.cli:main"

[tool.uv]
constraint-dependencies = ["litellm==1.105.1"]

[tool.uv.sources]
sopops = { path = "sdks/python", editable = true }

[dependency-groups]
# sopops[mcp]: tests/test_mcp.py runs sopops-mcp against the app in-process.
dev = ["pytest>=8", "httpx2", "respx>=0.23.1", "sopops[mcp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopops_server"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles web/dist, if built, as sopops_server/static

[tool.pytest.ini_options]
testpaths = ["tests"]
