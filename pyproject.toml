[project]
name = "sopops"
version = "0.1.0"
description = "Versioned sopc workspaces, and each agent's compiled prompt at call start."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.48",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
sopops = "sopops.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopops"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles web/dist, if built, as sopops/static

[tool.pytest.ini_options]
testpaths = ["tests"]
