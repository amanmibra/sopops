[project]
name = "sopops"
version = "0.5.3"
description = "Fetch your agent's instructions from sopops at call start, and send each finished session back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["sopops", "sop", "voice agents", "livekit", "prompts", "mcp"]
classifiers = ["Typing :: Typed"]

[project.urls]
Homepage = "https://sopops.dev"
Documentation = "https://docs.sopops.dev"
Repository = "https://github.com/sopops-dev/sopops"

[project.optional-dependencies]
livekit = ["livekit-agents>=1.0"]
# sopops-mcp: the onboarding MCP server a coding agent (Claude Code, Codex) runs, talking to sopops over HTTP.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
sopops-mcp = "sopops.mcp:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "mcp>=2.3,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
