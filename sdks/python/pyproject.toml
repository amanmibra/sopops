[project]
name = "sopops-client"
version = "0.1.0"
description = "Fetch your agent's instructions from sopops at call start, and send each finished session back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["sopops", "sopc", "voice agents", "livekit", "prompts"]
classifiers = ["Typing :: Typed"]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopops_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
